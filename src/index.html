<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Capsule</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f6f7f9);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e1e5ea);
      --border-strong: var(--hub-border, #c9d1dc);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #667085);
      --primary: var(--hub-primary, #0f766e);
      --primary-hover: var(--hub-primary-hover, #115e59);
      --primary-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 8px);
      --shadow: 0 1px 3px rgba(15, 23, 42, .08);
      --blue: var(--hub-tint-info-fg, #1d4ed8);
      --blue-soft: var(--hub-tint-info, #dbeafe);
      --green: var(--hub-tint-success-fg, #047857);
      --green-soft: var(--hub-tint-success, #d1fae5);
      --amber: var(--hub-tint-warning-fg, #b45309);
      --amber-soft: var(--hub-tint-warning, #fef3c7);
      --red: var(--hub-tint-danger-fg, #b91c1c);
      --red-soft: var(--hub-tint-danger, #fee2e2);
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }
    .app { max-width: 960px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.32rem; line-height: 1.2; }
    h2 { font-size: 1rem; margin-bottom: 10px; }
    h3 { font-size: .92rem; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 12px; }
    .grid { display: grid; gap: 12px; }
    .grid.two { grid-template-columns: 1fr; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .capsule-card { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .capsule-card:hover { border-color: var(--border-strong); box-shadow: 0 5px 14px rgba(15, 23, 42, .08); }
    .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .tools { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
    .title { font-weight: 780; font-size: 1rem; }
    .meta { margin-top: 3px; color: var(--muted); font-size: .82rem; }
    .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .pill {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 24px; padding: 2px 8px; border-radius: 999px;
      background: var(--bg); color: var(--muted); font-size: .74rem; font-weight: 760; white-space: nowrap;
    }
    .pill.open { background: var(--blue-soft); color: var(--blue); }
    .pill.closed { background: var(--amber-soft); color: var(--amber); }
    .pill.revealed { background: var(--green-soft); color: var(--green); }
    .tabs { display: flex; gap: 4px; background: var(--border); padding: 3px; border-radius: 10px; margin-bottom: 14px; }
    .tab { flex: 1; border: 0; border-radius: 8px; background: transparent; color: var(--muted); padding: 7px; font-weight: 760; cursor: pointer; }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 8px 12px;
      font: inherit; font-size: .86rem; font-weight: 760; cursor: pointer;
      min-height: 38px; background: var(--primary); color: var(--primary-fg);
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: transparent; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { min-height: 31px; padding: 5px 9px; font-size: .78rem; }
    .back { margin-bottom: 10px; }
    .form { display: grid; gap: 10px; }
    .field { display: grid; gap: 4px; }
    label { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 820; }
    input, select, textarea {
      width: 100%; border: 1.5px solid var(--border-strong); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 96px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
    .entry { display: grid; gap: 9px; border-top: 1px solid var(--border); padding-top: 12px; }
    .entry:first-child { border-top: 0; padding-top: 0; }
    .letter { white-space: pre-wrap; }
    .avatar {
      width: 22px; height: 22px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: white; font-size: .72rem; font-weight: 820; margin: 0 4px;
    }
    .attachment { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-weight: 700; text-decoration: none; }
    .empty, .loading { color: var(--muted); text-align: center; padding: 32px 16px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .notice { background: var(--green-soft); color: var(--green); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    @media (min-width: 760px) {
      .grid.two { grid-template-columns: 1.05fr .95fr; align-items: start; }
    }
    @media (max-width: 600px) {
      .topbar, .row { align-items: stretch; flex-direction: column; }
      .tools .btn { flex: 1; }
    }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
  </style>
  <base href="/run/time-capsule/">
</head>
<body>
<div class="app">
  <div id="root" class="loading">Loading...</div>
</div>

<script type="module">
import { esc, isAdult, memberColor, initial, hubConfirm, createFilesHelper, searchMatch, hubToday as today, glyph } from "/hub-sdk.js";
import {
  nextYear, fmtDate, statusLabel,
  capsuleEntries as capsuleEntriesOf, entryAttachments as entryAttachmentsOf,
  memberById as memberByIdOf, canAddEntry, canReadEntries, effectiveStatus,
  isMine as isMineOf, visibleEntries as visibleEntriesOf, filteredCapsules as filteredCapsulesOf, searchableFields,
  calendarRef, outcomeUnknown, failureLine, uploadFailureLine,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? window.__FAMILY_HUB_CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const FILES = window.__FILES_URL ?? "";
const EVENTS_URL = window.__EVENTS_URL ?? "/api/events";
const APP_ID = window.__APP_ID ?? "time-capsule";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const files = createFilesHelper(FILES);

// Fire-and-forget cross-app event. Declared in manifest `publishes`/`alert_on`;
// gated to adults by `publish_acls`, which matches the adult-only actions below.
function publishEvent(type, subjectId, payload = {}) {
  if (!DB) return; // demo mode has no event bus
  fetch(EVENTS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source_app_id: APP_ID, type, subject_id: subjectId, payload }),
  }).catch(() => {});
}

let members = [];
let currentMember = null;
let capsules = [];
let entries = [];
let attachments = [];
let selectedCapsuleId = null;
let showCreateForm = false;
let view = "active";
let searchQ = "";       // in-app search (see logic.js searchableFields)
let error = "";
let notice = "";

function nowIso() { return new Date().toISOString(); }
function uid(prefix) { return `${prefix}-${crypto.randomUUID()}`; }
function canManage() { return isAdult(currentMember); }
function selectedCapsule() { return capsules.find(c => c.id === selectedCapsuleId) ?? null; }
function capsuleEntries(capsuleId) { return capsuleEntriesOf(entries, capsuleId); }
function entryAttachments(entryId) { return entryAttachmentsOf(attachments, entryId); }
function memberById(id) { return memberByIdOf(members, id); }
function isMine(entry) { return isMineOf(entry, currentMember?.id); }
function visibleEntries(capsule) { return visibleEntriesOf(entries, capsule, currentMember?.id); }

async function dbq(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || "Couldn’t reach the hub. Try again."), { status: res.status, code: json?.code });
  return json;
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-2", name: "Jordan", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
      { id: "demo-4", name: "Riley", role: "child" },
    ];
  } else {
    // A roster that cannot be read is a failed load, not an empty household.
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    const json = await res.json().catch(() => null);
    if (!res.ok || !json || typeof json !== "object") throw new Error("Couldn’t reach the hub. Try again.");
    // A 200 that names the roster in `$errors` is the hub failing to read it.
    if (Array.isArray(json.$errors) && json.$errors.includes("family.members")) throw new Error("Couldn’t reach the hub. Try again.");
    members = json["family.members"] ?? [];
  }
  currentMember = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

async function seedDemo() {
  if (DB) return;
  const newYear = "demo-new-year";
  const birthday = "demo-birthday";
  capsules = [
    {
      id: newYear,
      title: "New Year's Predictions",
      occasion: "New Year",
      reveal_date: nextYear(),
      status: "open",
      prompt: "What do you think will change by next year?",
      created_by_id: "demo-1",
      created_by_name: "Alex",
      created_at: nowIso(),
      closed_at: "",
      revealed_at: "",
      archived_at: "",
    },
    {
      id: birthday,
      title: "18th Birthday Letters",
      occasion: "Birthday",
      reveal_date: "2031-05-18",
      status: "closed",
      prompt: "A note for the future.",
      created_by_id: "demo-2",
      created_by_name: "Jordan",
      created_at: nowIso(),
      closed_at: nowIso(),
      revealed_at: "",
      archived_at: "",
    },
  ];
  entries = [
    {
      id: "entry-1",
      capsule_id: newYear,
      member_id: "demo-1",
      member_name: "Alex",
      entry_type: "prediction",
      title: "My bold guess",
      body: "We will finally finish the garden beds, and Casey will be taller than Jordan.",
      created_at: nowIso(),
      updated_at: nowIso(),
    },
  ];
  attachments = [];
}

async function loadData() {
  if (!DB) { await seedDemo(); return; }
  const [capsuleRows, entryRows] = await Promise.all([
    dbq("SELECT * FROM app_time_capsule__capsules ORDER BY reveal_date ASC, created_at ASC"),
    dbq("SELECT * FROM app_time_capsule__entries ORDER BY created_at ASC"),
  ]);
  capsules = capsuleRows.rows;
  entries = entryRows.rows;
}

// Attachments render only inside one capsule's detail view, so the whole table
// no longer rides along on every launch — it is fetched per capsule on first
// open. Unlike entries, nothing counts or badges attachments on the list, so
// dropping them from the preload changes nothing a user sees. The cached
// promise (not a done flag) is the guard: a second open mid-fetch cannot start
// a duplicate read, and a failure clears it so the next open retries. Merging
// dedups by id because an attachment just uploaded is already in the array.
const attachmentLoads = new Map();
function loadAttachmentsFor(capsuleId) {
  if (!DB) return Promise.resolve();
  let p = attachmentLoads.get(capsuleId);
  if (!p) {
    p = dbq("SELECT * FROM app_time_capsule__attachments WHERE capsule_id = ? ORDER BY created_at ASC", [capsuleId])
      .then((res) => {
        const seen = new Set(attachments.map((a) => a.id));
        attachments = [...attachments, ...(res.rows ?? []).filter((a) => !seen.has(a.id))];
      })
      .catch((e) => { attachmentLoads.delete(capsuleId); throw e; });
    attachmentLoads.set(capsuleId, p);
  }
  return p;
}

// loadFailed is set when the first load fails and cleared when a load
// succeeds. A later refresh that fails keeps what is on screen.
let loaded = false, loadFailed = false;
async function refresh() {
  clearMessages();
  try {
    await loadMembers();
    await loadData();
    loaded = true; loadFailed = false;
    if (selectedCapsuleId && !capsules.some(c => c.id === selectedCapsuleId)) selectedCapsuleId = null;
    render();
  } catch (e) {
    // The hub's text stays in the console; what is on screen stays.
    console.error(e);
    if (loaded) error = "Couldn’t refresh."; else loadFailed = true;
    render();
  }
}

function clearMessages() { error = ""; notice = ""; }
function showError(message) { error = message; notice = ""; render(); }
function showNotice(message) { notice = message; error = ""; render(); }
// A form's own failure is said in the form, without redrawing it: a redraw
// would empty what was typed, and a refused save must leave that to send again.
function showFormError(form, message) {
  const note = form.querySelector("[data-form-error]");
  if (!note || !form.isConnected) return showError(message);
  note.textContent = message;
  note.hidden = false;
}

// The file already uploaded for the entry form that is open, kept while its
// entry is still unsaved: sending the form again reuses it instead of storing
// the same file twice. Picking another file, or leaving the form, discards it.
let pendingUpload = null; // { form, file, uploaded }
function discardPendingUpload() {
  const pending = pendingUpload;
  pendingUpload = null;
  // Best-effort: the hub lets the uploader delete a file nothing refers to.
  if (pending) files.delete(pending.uploaded.id).catch(() => {});
}

async function createCapsule(form) {
  if (!canManage()) return showError("Only adults can create capsules.");
  const title = form.title.value.trim();
  const revealDate = form.reveal_date.value;
  if (!title || !revealDate) return showFormError(form, "Title and reveal date are required.");
  let savedNote = "";
  // The id is the form's, minted on its first Create and sent on every retry:
  // a try whose answer was lost may have stored the capsule, and a second press
  // must find it rather than store another and announce it twice.
  let capsule = {
    id: (form.dataset.rowId ||= uid("capsule")),
    title,
    occasion: form.occasion.value.trim(),
    reveal_date: revealDate,
    status: "open",
    prompt: form.prompt.value.trim(),
    created_by_id: currentMember.id,
    created_by_name: currentMember.name,
    created_at: nowIso(),
    closed_at: "",
    revealed_at: "",
    archived_at: "",
  };
  if (DB) {
    try {
      await dbq(
        `INSERT INTO app_time_capsule__capsules
         (id, title, occasion, reveal_date, status, prompt, created_by_id, created_by_name, created_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
        [capsule.id, capsule.title, capsule.occasion, capsule.reveal_date, capsule.status, capsule.prompt, capsule.created_by_id, capsule.created_by_name, capsule.created_at]
      );
    } catch (e) {
      console.error(e);
      // Unknown outcome: read the capsule back by the pinned id. Found means an
      // earlier try landed and its success path never ran: it runs now, once.
      // Not found, or the read failed: the usual line, the id stays pinned.
      let stored = null;
      let readFailed = false;
      if (outcomeUnknown(e)) {
        try { stored = (await dbq("SELECT * FROM app_time_capsule__capsules WHERE id = ?", [capsule.id])).rows?.[0] ?? null; }
        catch (readErr) { console.error(readErr); readFailed = true; }
      }
      // The id is ours: with the read-back failed, a UNIQUE answer may be this
      // form's own first try, so nothing is known — "try again", not "already exists".
      if (!stored) return showFormError(form, failureLine(readFailed ? null : e, { action: "create the capsule", thing: "capsule" }));
      if (["title", "occasion", "reveal_date", "prompt"].some((k) => String(stored[k] ?? "") !== String(capsule[k] ?? ""))) {
        savedNote = "Saved as first entered — check it and update what changed.";
      }
      capsule = { ...capsule, ...stored };
    }
  }
  delete form.dataset.rowId;
  capsules = capsules.filter((c) => c.id !== capsule.id);
  capsules.push(capsule);
  capsules.sort((a, b) => (a.reveal_date || "").localeCompare(b.reveal_date || "") || a.created_at.localeCompare(b.created_at));
  form.reset();
  showCreateForm = false;
  selectedCapsuleId = capsule.id;
  view = "active";
  clearMessages();
  render();
  if (savedNote) showError(savedNote);
  publishEvent("time_capsule.created", capsule.id, {
    title: capsule.title, reveal_date: capsule.reveal_date, source_ref_id: calendarRef(capsule.id),
  });
}

async function addEntry(form) {
  const capsule = selectedCapsule();
  if (!canAddEntry(capsule)) return showError("This capsule is sealed.");
  const title = form.title.value.trim();
  const body = form.body.value.trim();
  if (!title || !body) return showFormError(form, "Entry title and message are required.");

  const file = form.photo?.files?.[0] ?? null;
  const btn = form.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = file ? "Uploading…" : "Sealing…"; }

  try {
    let attachment = null;
    if (pendingUpload && (pendingUpload.form !== form || pendingUpload.file !== file)) discardPendingUpload();
    if (file && FILES) {
      const uploaded = pendingUpload?.uploaded ?? await files.upload(file);
      pendingUpload = { form, file, uploaded };
      // The hub says what it stored, which is not always what was picked: a
      // HEIC photo is kept as a JPEG, under another name and type.
      attachment = {
        id: uid("attachment"),
        entry_id: null,
        capsule_id: capsule.id,
        uploaded_by: currentMember.id,
        file_name: uploaded.name ?? file.name,
        file_ref: uploaded.id,
        content_type: uploaded.mimeType ?? file.type,
        created_at: nowIso(),
      };
    }
    const entry = {
      id: uid("entry"),
      capsule_id: capsule.id,
      member_id: currentMember.id,
      member_name: currentMember.name,
      entry_type: form.entry_type.value,
      title,
      body,
      created_at: nowIso(),
      updated_at: nowIso(),
    };
    if (attachment) attachment.entry_id = entry.id;
    if (DB) {
      try {
        await dbq(
          `INSERT INTO app_time_capsule__entries
           (id, capsule_id, member_id, member_name, entry_type, title, body, created_at, updated_at)
           VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
          [entry.id, entry.capsule_id, entry.member_id, entry.member_name, entry.entry_type, entry.title, entry.body, entry.created_at, entry.updated_at]
        );
      } catch (e) {
        console.error(e);
        throw e;
      }
      // Sealed: the upload belongs to this entry now, not to the form.
      pendingUpload = null;
      if (attachment) {
        // The entry is sealed by now. A file that then fails to attach must
        // not read as an unsaved entry, or sending again would seal it twice.
        let attached = false, refused = false;
        try {
          const res = await dbq(
            `INSERT INTO app_time_capsule__attachments
             (id, entry_id, capsule_id, uploaded_by, file_name, file_ref, content_type, created_at)
             VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,
            [attachment.id, attachment.entry_id, attachment.capsule_id, attachment.uploaded_by, attachment.file_name, attachment.file_ref, attachment.content_type, attachment.created_at]
          );
          attached = res.changed !== 0;
          refused = !attached;
        } catch (e) {
          console.error(e);
          refused = e.status === 403;
        }
        if (!attached) {
          // Refused by the hub, so nothing refers to the file: discard it,
          // best-effort. With no answer it may be attached, and is left alone.
          if (refused) files.delete(attachment.file_ref).catch(() => {});
          entries.push(entry);
          return showError("Entry sealed, but the file couldn’t be attached.");
        }
      }
    }
    pendingUpload = null;
    entries.push(entry);
    if (attachment) attachments.push(attachment);
    showNotice("Entry sealed.");
  } catch (e) {
    // Nothing was sealed: the form stays as typed, file included, to send again.
    // A refused upload or entry says why in this app's words; never the hub's.
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = "Seal Entry"; }
    showFormError(form, uploadFailureLine(e, { action: "seal the entry", thing: "entry" }));
  }
}

async function updateCapsuleStatus(capsule, status) {
  if (!canManage()) return showError("Only adults can change capsule status.");
  const ok = await hubConfirm(`${statusLabel(status)} "${capsule.title}"?`);
  if (!ok) return;
  const fields = {
    closed: ["closed_at", nowIso()],
    revealed: ["revealed_at", nowIso()],
    archived: ["archived_at", nowIso()],
  };
  const [stampField, stampValue] = fields[status] ?? ["archived_at", nowIso()];
  if (DB) {
    let res;
    try {
      res = await dbq(
        `UPDATE app_time_capsule__capsules SET status = ?, ${stampField} = ? WHERE id = ?`,
        [status, stampValue, capsule.id]
      );
    } catch (e) {
      console.error(e);
      return showError(failureLine(e, { action: "update the capsule", thing: "capsule" }));
    }
    // An archived capsule is frozen: the hub changes nothing and says so only
    // in the count. Re-read it: gone is removed; another status is someone
    // else's change; the same status is the row policy refusing this member.
    // Then show what the hub holds.
    if (res.changed === 0) {
      let found = null, moved = false;
      try {
        const stored = (await dbq("SELECT status FROM app_time_capsule__capsules WHERE id = ?", [capsule.id])).rows?.[0] ?? null;
        found = !!stored;
        moved = !!stored && stored.status !== capsule.status;
      } catch (readErr) { console.error(readErr); }
      await refresh();
      return showError(failureLine(null, { action: "update the capsule", thing: "capsule", found, guarded: moved }));
    }
  }
  Object.assign(capsule, { status, [stampField]: stampValue });
  clearMessages();
  render();
  const eventType = { closed: "time_capsule.closed", revealed: "time_capsule.revealed" }[status];
  if (eventType) publishEvent(eventType, capsule.id, { title: capsule.title, reveal_date: capsule.reveal_date });
}

function filteredCapsules() { return filteredCapsulesOf(capsules, view); }

function renderAppShell(content) {
  return `
    <div class="topbar">
      <div>
        <h1>Time Capsule</h1>
        <div class="muted tiny">${esc(currentMember?.name ?? "Guest")}</div>
      </div>
      ${canManage() && !loadFailed ? `<button class="btn" data-action="new">New Capsule</button>` : ""}
    </div>
    ${loadFailed ? `<div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the capsules.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>` : ""}
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${notice ? `<div class="notice">${esc(notice)}</div>` : ""}
    ${loadFailed ? "" : content}
  `;
}

// Owns the filtering and the empty states, so the keystroke handler can refresh
// the list without repeating how it is derived.
function renderCapsuleList() {
  const list = filteredCapsules();
  const shown = searchQ ? list.filter(c => searchMatch(searchQ, searchableFields(c))) : list;
  if (shown.length) return shown.map(renderCapsuleCard).join("");
  if (searchQ) return `<div class="empty card">No capsules match "${esc(searchQ)}".</div>`;
  return `<div class="empty card">No capsules here yet.</div>`;
}

function renderList() {
  const list = filteredCapsules();
  return renderAppShell(`
    <div class="tabs">
      <button class="tab ${view === "active" ? "active" : ""}" data-testid="tab-active" data-view="active">Active</button>
      <button class="tab ${view === "archive" ? "active" : ""}" data-testid="tab-archive" data-view="archive">Archive</button>
    </div>
    <div class="grid two">
      <div class="stack">
        ${list.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search capsules…" aria-label="Search capsules" value="${esc(searchQ)}" /></div>` : ""}
        <div id="capsule-list">${renderCapsuleList()}</div>
      </div>
      ${canManage() && showCreateForm ? renderCreateForm() : renderMemberPanel()}
    </div>
  `);
}

function renderCapsuleCard(capsule) {
  const count = capsuleEntries(capsule.id).length;
  const mine = capsuleEntries(capsule.id).filter(isMine).length;
  return `
    <article class="card capsule-card" data-testid="capsule-card" data-capsule-id="${esc(capsule.id)}"
             data-status="${esc(effectiveStatus(capsule))}" data-entry-count="${count}" data-open="${esc(capsule.id)}">
      <div class="row">
        <div>
          <div class="title">${esc(capsule.title)}</div>
          <div class="meta">${esc(capsule.occasion || "Family")} · opens ${fmtDate(capsule.reveal_date)}</div>
        </div>
        <span class="pill ${esc(effectiveStatus(capsule))}">${statusLabel(effectiveStatus(capsule))}</span>
      </div>
      ${capsule.prompt ? `<p class="meta">${esc(capsule.prompt)}</p>` : ""}
      <div class="stats">
        <span class="pill">${count} ${count === 1 ? "entry" : "entries"}</span>
        <span class="pill">${mine} yours</span>
        <span class="pill">by ${esc(capsule.created_by_name)}</span>
      </div>
    </article>
  `;
}

function renderCreateForm() {
  return `
    <section class="card">
      <h2>New capsule</h2>
      <form class="form" data-form="create">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" maxlength="120" placeholder="New Year's 2027" required />
        </div>
        <div class="field">
          <label for="occasion">Occasion</label>
          <input id="occasion" name="occasion" maxlength="80" placeholder="Anniversary, birthday, reunion" />
        </div>
        <div class="field">
          <label for="reveal_date">Reveal date</label>
          <input id="reveal_date" name="reveal_date" type="date" value="${nextYear()}" min="${today()}" required />
        </div>
        <div class="field">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" name="prompt" maxlength="500" placeholder="What should everyone write?"></textarea>
        </div>
        <div class="error" role="alert" data-form-error hidden></div>
        <div class="tools" style="justify-content:flex-start">
          <button class="btn" type="submit">Create</button>
          <button class="btn btn-ghost" type="button" data-action="cancel-new">Cancel</button>
        </div>
      </form>
    </section>
  `;
}

function renderMemberPanel() {
  const hint = canManage()
    ? `Tap <strong>New Capsule</strong> to start one, or open a capsule to write.`
    : `Open a capsule to write or read.`;
  return `<section class="card"><h2>Your entries</h2><p class="muted">${hint}</p></section>`;
}

function renderDetail() {
  const capsule = selectedCapsule();
  if (!capsule) return renderList();
  if (DB && !attachmentLoads.has(capsule.id)) loadAttachmentsFor(capsule.id).then(render).catch(() => {});
  const list = visibleEntries(capsule);
  return renderAppShell(`
    <button class="btn btn-ghost back" data-testid="detail-back" data-action="back">Back</button>
    <div class="grid two" data-testid="capsule-detail" data-capsule-id="${esc(capsule.id)}">
      <div class="stack">
        <section class="card">
          <div class="row">
            <div>
              <h2>${esc(capsule.title)}</h2>
              <div class="meta">${esc(capsule.occasion || "Family")} · opens ${fmtDate(capsule.reveal_date)}</div>
            </div>
            <span class="pill ${esc(effectiveStatus(capsule))}">${statusLabel(effectiveStatus(capsule))}</span>
          </div>
          ${capsule.prompt ? `<p class="meta">${esc(capsule.prompt)}</p>` : ""}
          ${renderCapsuleActions(capsule)}
        </section>
        <section class="card">
          <h2>${canReadEntries(capsule) ? "Revealed entries" : "Your sealed entries"}</h2>
          <div class="stack" data-testid="entry-list">
            ${list.length ? list.map(entry => renderEntry(capsule, entry)).join("") : `<div class="empty">No visible entries yet.</div>`}
          </div>
        </section>
      </div>
      ${canAddEntry(capsule) ? renderEntryForm() : renderClosedPanel(capsule)}
    </div>
  `);
}

function renderCapsuleActions(capsule) {
  if (!canManage()) return "";
  // Once the reveal date has passed the hub already releases entries to everyone, so
  // the manual Seal/Reveal boundary no longer applies — only offer them while sealed.
  const released = canReadEntries(capsule);
  const close = !released && capsule.status === "open" ? `<button class="btn btn-ghost btn-sm" data-status="closed">Seal</button>` : "";
  const reveal = !released && capsule.status === "closed" ? `<button class="btn btn-sm" data-status="revealed">Reveal early</button>` : "";
  const archive = effectiveStatus(capsule) === "revealed" ? `<button class="btn btn-ghost btn-sm" data-status="archived">Archive</button>` : "";
  return close || reveal || archive ? `<div class="tools" style="margin-top:12px">${close}${reveal}${archive}</div>` : "";
}

function renderEntry(entryCapsule, entry) {
  const member = memberById(entry.member_id);
  const atts = entryAttachments(entry.id);
  return `
    <article class="entry" data-testid="entry" data-entry-id="${esc(entry.id)}"
             data-mine="${isMine(entry) ? "yes" : "no"}">
      <div class="row">
        <div>
          <h3>${esc(entry.title)}</h3>
          <div class="meta">
            <span class="pill">${esc(entry.entry_type.replace("_", " "))}</span>
            <span class="avatar" style="background:${memberColor(member?.id ?? entry.member_id)}">${initial(member?.name ?? entry.member_name)}</span>
            ${esc(member?.name ?? entry.member_name)}
          </div>
        </div>
        <div class="tiny muted">${fmtDate(entry.created_at.slice(0, 10))}</div>
      </div>
      <div class="letter">${esc(entry.body)}</div>
      ${atts.length ? `<div>${atts.map(renderAttachment).join(" ")}</div>` : ""}
    </article>
  `;
}

function attachmentUrl(attachment) {
  const ref = attachment.file_ref || "";
  // Legacy rows stored a full URL; new rows store a hub file id.
  if (/^https?:\/\//.test(ref) || ref.startsWith("/")) return ref;
  return FILES ? files.url(ref) : ref;
}

function renderAttachment(attachment) {
  const url = attachmentUrl(attachment);
  const isImage = (attachment.content_type || "").startsWith("image/");
  if (isImage) {
    return `<a class="attachment" href="${esc(url)}" target="_blank" rel="noreferrer">
      <img src="${esc(url)}" alt="${esc(attachment.file_name)}"
        style="max-width:100%;max-height:320px;border-radius:8px;display:block;margin-top:4px" />
    </a>`;
  }
  return `<a class="attachment" href="${esc(url)}" target="_blank" rel="noreferrer">${glyph("paperclip")} ${esc(attachment.file_name)}</a>`;
}

function renderEntryForm() {
  return `
    <section class="card">
      <h2>Add entry</h2>
      <form class="form" data-form="entry">
        <div class="field">
          <label for="entry_type">Type</label>
          <select id="entry_type" name="entry_type">
            <option value="letter">Letter</option>
            <option value="prediction">Prediction</option>
            <option value="memory">Memory</option>
            <option value="photo_note">Photo note</option>
          </select>
        </div>
        <div class="field">
          <label for="entry_title">Title</label>
          <input id="entry_title" name="title" maxlength="120" required />
        </div>
        <div class="field">
          <label for="body">Message</label>
          <textarea id="body" name="body" maxlength="5000" required></textarea>
        </div>
        ${FILES ? `
        <div class="field">
          <label for="photo">Photo or file</label>
          <input id="photo" name="photo" type="file"
            accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,application/pdf" />
          <div class="tiny muted">Optional — attach a photo or PDF to seal with this entry.</div>
        </div>` : ""}
        <div class="error" role="alert" data-form-error hidden></div>
        <button class="btn" type="submit">Seal Entry</button>
      </form>
    </section>
  `;
}

function renderClosedPanel(capsule) {
  const text = canReadEntries(capsule) ? "Everything is open." : "Entries are sealed.";
  return `<section class="card"><h2>${statusLabel(effectiveStatus(capsule))}</h2><p class="muted">${text}</p></section>`;
}

function render() {
  const root = document.getElementById("root");
  root.className = "";
  root.innerHTML = selectedCapsuleId ? renderDetail() : renderList();
  // A redraw replaces the entry form, and the file picked in it is gone with it.
  if (pendingUpload && !pendingUpload.form.isConnected) discardPendingUpload();
}

// Another file picked (or the file cleared) after a refused save: the first
// upload is no longer what this form will seal.
document.addEventListener("change", (e) => {
  if (e.target.id === "photo" && pendingUpload) discardPendingUpload();
});

// Re-render only the list on each keystroke so the search box keeps focus.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  const el = document.getElementById("capsule-list");
  if (el) el.innerHTML = renderCapsuleList();
});

document.addEventListener("click", async (event) => {
  if (event.target.closest('[data-testid="load-retry"]')) return refresh();
  const open = event.target.closest("[data-open]");
  if (open) {
    selectedCapsuleId = open.dataset.open;
    clearMessages();
    render();
    return;
  }
  const action = event.target.closest("[data-action]")?.dataset.action;
  if (action === "back") {
    selectedCapsuleId = null;
    clearMessages();
    render();
    return;
  }
  if (action === "new") {
    selectedCapsuleId = null;
    showCreateForm = true;
    view = "active";
    clearMessages();
    render();
    document.getElementById("title")?.focus();
    return;
  }
  if (action === "cancel-new") {
    showCreateForm = false;
    clearMessages();
    render();
    return;
  }
  const tab = event.target.closest("[data-view]");
  if (tab) {
    view = tab.dataset.view;
    clearMessages();
    render();
    return;
  }
  const status = event.target.closest("[data-status]")?.dataset.status;
  if (status) {
    await updateCapsuleStatus(selectedCapsule(), status);
  }
});

document.addEventListener("submit", async (event) => {
  const form = event.target;
  if (!form.matches("[data-form]")) return;
  event.preventDefault();
  const btn = form.querySelector('button[type="submit"]');
  if (btn?.disabled) return;
  const note = form.querySelector("[data-form-error]");
  if (note) note.hidden = true;
  try {
    if (form.dataset.form === "create") {
      // One save at a time; the button comes back whether or not it landed.
      if (btn) btn.disabled = true;
      try { await createCapsule(form); } finally { if (btn) btn.disabled = false; }
    }
    if (form.dataset.form === "entry") await addEntry(form);
  } catch (e) {
    console.error(e);
    showFormError(form, failureLine(e, form.dataset.form === "create"
      ? { action: "create the capsule", thing: "capsule" }
      : { action: "seal the entry", thing: "entry" }));
  }
});

refresh();
</script>
